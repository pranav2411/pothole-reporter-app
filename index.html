<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Pothole Reporter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        
        body {
            font-family: 'Plus Jakarta Sans', 'Outfit', sans-serif;
            background: radial-gradient(circle at 50% 0%, #1c273a 0%, #0d1117 80%);
            color: #e6edf3;
        }
        
        .glass-card {
            background: rgba(22, 27, 34, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(240, 246, 252, 0.1);
            box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #1f6feb 0%, #0972d4 100%);
            box-shadow: 0 4px 15px rgba(31, 111, 235, 0.35);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 22px rgba(31, 111, 235, 0.5);
            background: linear-gradient(135deg, #388bfd 0%, #1f6feb 100%);
        }
        .btn-primary:active {
            transform: translateY(0);
        }
        
        .btn-secondary {
            background: rgba(33, 38, 45, 0.7);
            border: 1px solid rgba(240, 246, 252, 0.1);
            transition: all 0.2s ease;
        }
        .btn-secondary:hover {
            background: rgba(48, 54, 61, 0.85);
            border-color: rgba(240, 246, 252, 0.2);
            transform: translateY(-1px);
        }
        
        .glow-title {
            background: linear-gradient(135deg, #58a6ff 0%, #1f6feb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-family: 'Outfit', sans-serif;
            letter-spacing: -0.03em;
        }

        .scanning-loader {
            position: relative;
            overflow: hidden;
        }
        .scanning-loader::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(to right, transparent, #58a6ff, transparent);
            animation: scanning 2.5s linear infinite;
        }
        @keyframes scanning {
            0% { top: 0%; }
            50% { top: 100%; }
            100% { top: 0%; }
        }

        #map, #confirm-map {
            height: 400px;
            border-radius: 12px;
            border: 1px solid rgba(240, 246, 252, 0.1);
            box-shadow: inset 0 0 15px rgba(0,0,0,0.6);
        }
        
        .leaflet-popup-content-wrapper {
            background: rgba(22, 27, 34, 0.95) !important;
            backdrop-filter: blur(12px);
            color: #e6edf3 !important;
            border: 1px solid rgba(240, 246, 252, 0.15) !important;
            border-radius: 12px !important;
            box-shadow: 0 8px 30px rgba(0,0,0,0.5) !important;
        }
        .leaflet-popup-tip {
            background: rgba(22, 27, 34, 0.95) !important;
            border-left: 1px solid rgba(240, 246, 252, 0.15) !important;
            border-bottom: 1px solid rgba(240, 246, 252, 0.15) !important;
        }
        
        .leaflet-popup-image {
            width: 100%;
            height: 120px;
            object-fit: cover;
            border-radius: 8px;
            margin-top: 8px;
            border: 1px solid rgba(240, 246, 252, 0.1);
        }
        
        .legend {
            background: rgba(22, 27, 34, 0.9) !important;
            backdrop-filter: blur(10px);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(240, 246, 252, 0.1);
            color: #e6edf3;
            line-height: 1.6;
            font-size: 12px;
        }
        .legend h4 {
            margin: 0 0 6px 0;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #8b949e;
        }
        .legend i {
            width: 12px;
            height: 12px;
            float: left;
            margin-top: 4px;
            margin-right: 8px;
            border-radius: 50%;
            box-shadow: 0 0 8px currentColor;
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-lg mx-auto">
        <div id="main-card" class="glass-card rounded-2xl p-8">
            <div class="text-center mb-8">
                <h1 class="text-4xl font-extrabold text-gray-100 glow-title">GeoPothole AI</h1>
                <p class="text-gray-400 mt-3 text-sm">Real-time road infrastructure monitor leveraging Computer Vision, geospatial duplicate checking, and LLM validation.</p>
            </div>

            <div id="location-section" class="mb-6 p-4 rounded-xl bg-white/5 border border-white/5">
                <div class="flex items-center justify-center space-x-2 text-cyan-400">
                    <svg id="location-icon" class="w-5 h-5 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                    <span id="location-status" class="font-semibold text-gray-200">Retrieving Location...</span>
                </div>
                <p id="coords-display" class="text-xs text-center text-gray-500 mt-2 font-mono"></p>
                <div class="text-center mt-3">
                    <button id="manual-location-btn" class="text-xs font-semibold text-cyan-400 hover:text-cyan-300 hidden tracking-wider uppercase">Or Enter Address Manually</button>
                </div>
                <div id="manual-location-form" class="hidden mt-4 space-y-3">
                    <input type="text" id="manual-address-input" class="w-full bg-gray-900/60 border border-gray-700/80 rounded-lg px-3 py-2 text-white focus:outline-none focus:ring-2 focus:ring-cyan-500/50 text-sm" placeholder="Enter street address">
                    <button id="submit-manual-location" class="w-full btn-secondary text-white font-semibold py-2 px-4 rounded-lg text-sm">Set Custom Address</button>
                </div>
            </div>

            <div id="upload-section">
                <input type="file" id="image-upload" class="hidden" accept="image/jpeg, image/png">
                <button id="upload-button" class="w-full btn-primary text-white font-bold py-3.5 px-4 rounded-xl flex items-center justify-center space-x-2 text-base">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                    <span>Analyze & Report Pothole</span>
                </button>
            </div>
            
            <div class="text-center mt-6">
                <button id="map-view-btn" class="text-sm font-semibold text-cyan-400 hover:text-cyan-300 flex items-center justify-center mx-auto space-x-1">
                    <span>Explore Incident Map</span>
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                </button>
            </div>
        </div>

        <!-- Confirm Location Card -->
        <div id="confirm-location-card" class="glass-card rounded-2xl p-6 hidden mt-4">
            <div class="text-center">
                <h2 class="text-xl font-bold text-gray-100 mb-2">Pinpoint Coordinates</h2>
                <p class="text-gray-400 text-sm mb-4">Drag the marker to the exact coordinates of the pothole.</p>
                <div id="confirm-map"></div>
                <p id="confirm-address" class="text-xs text-gray-300 mt-4 p-3 bg-white/5 border border-white/5 rounded-lg font-mono text-center"></p>
                <button id="confirm-submit-btn" class="w-full btn-primary text-white font-bold py-3 px-4 rounded-xl mt-4 text-sm">Verify & Run AI Diagnostics</button>
                <button id="cancel-submit-btn" class="w-full btn-secondary text-white font-semibold py-2 px-4 rounded-lg mt-2 text-xs">Cancel</button>
            </div>
        </div>

        <!-- AI Diagnostics Result Card -->
        <div id="result-card" class="glass-card rounded-2xl p-8 hidden mt-4">
             <div class="text-center">
                <h2 id="result-title" class="text-2xl font-bold text-gray-100 glow-title"></h2>
                
                <!-- Scanning Loader overlay replacement -->
                <div id="loader" class="hidden my-6">
                    <div class="relative w-48 h-48 mx-auto rounded-xl overflow-hidden border border-cyan-500/30 bg-gray-950/80 scanning-loader">
                        <div class="absolute inset-0 flex items-center justify-center">
                            <span class="text-xs font-semibold text-cyan-400 tracking-wider animate-pulse font-mono">AI DIAGNOSTICS RUNNING...</span>
                        </div>
                    </div>
                </div>

                <p id="result-message" class="text-gray-300 mt-3 text-sm leading-relaxed"></p>
                <img id="result-image" class="mt-5 rounded-xl border border-gray-700/60 max-h-80 w-auto mx-auto shadow-2xl" alt="Pothole detection result">
                
                <div id="assessment-details" class="hidden mt-5 text-left text-sm space-y-2.5 p-4 rounded-xl bg-white/5 border border-white/5"></div>
                <button id="report-another-btn" class="w-full btn-secondary text-white font-semibold py-2.5 px-4 rounded-xl mt-6 text-sm">Report Another Hazard</button>
            </div>
        </div>
        
        <!-- Live Incident Map Card -->
        <div id="map-card" class="glass-card rounded-2xl p-6 hidden mt-4">
             <div class="text-center">
                <h2 class="text-xl font-bold text-gray-100 mb-4">Infrastructure Incident Map</h2>
                <div id="map"></div>
                <button id="back-to-report-btn" class="w-full btn-secondary text-white font-semibold py-2.5 px-4 rounded-xl mt-6 text-sm">Return to Submission Portal</button>
            </div>
        </div>
    </div>

    <script>
        // --- DOM ELEMENTS ---
        const mainCard = document.getElementById('main-card');
        const confirmLocationCard = document.getElementById('confirm-location-card');
        const resultCard = document.getElementById('result-card');
        const mapCard = document.getElementById('map-card');
        const uploadButton = document.getElementById('upload-button');
        const imageUpload = document.getElementById('image-upload');
        const locationStatus = document.getElementById('location-status');
        const coordsDisplay = document.getElementById('coords-display');
        const locationIcon = document.getElementById('location-icon');
        const manualLocationBtn = document.getElementById('manual-location-btn');
        const manualLocationForm = document.getElementById('manual-location-form');
        const manualAddressInput = document.getElementById('manual-address-input');
        const submitManualLocation = document.getElementById('submit-manual-location');
        const confirmMapEl = document.getElementById('confirm-map');
        const confirmAddress = document.getElementById('confirm-address');
        const confirmSubmitBtn = document.getElementById('confirm-submit-btn');
        const cancelSubmitBtn = document.getElementById('cancel-submit-btn');
        const loader = document.getElementById('loader');
        const resultTitle = document.getElementById('result-title');
        const resultMessage = document.getElementById('result-message');
        const resultImage = document.getElementById('result-image');
        const assessmentDetails = document.getElementById('assessment-details');
        const reportAnotherBtn = document.getElementById('report-another-btn');
        const mapViewBtn = document.getElementById('map-view-btn');
        const backToReportBtn = document.getElementById('back-to-report-btn');

        // --- STATE ---
        let currentLocation = null;
        let publicMap = null;
        let confirmationMap = null;
        let uploadedImageBase64 = null;

        const createCircleMarker = (color) => L.divIcon({ className: 'custom-div-icon', html: `<div style="background-color:${color};width:20px;height:20px;border-radius:50%;border:2px solid white;"></div>`, iconSize: [24, 24], iconAnchor: [12, 12] });
        const icons = { 'Submitted': createCircleMarker('#f85149'), 'In Review': createCircleMarker('#e3b341'), 'Repaired': createCircleMarker('#2ea043') };
        const defaultIcon = createCircleMarker('#808080');

        // --- FUNCTIONS ---
        function getLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    async (position) => {
                        const { latitude, longitude, accuracy } = position.coords;
                        const address = await getAddressFromCoords(latitude, longitude);
                        currentLocation = { latitude, longitude, accuracy, address };
                        setLocationStatus(address, latitude, longitude, accuracy);
                    }, showError, { enableHighAccuracy: true }
                );
            } else {
                setLocationStatus("Geolocation is not supported.", null, null, null, true);
            }
        }

        async function getAddressFromCoords(lat, lon) {
            try {
                const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`);
                const data = await response.json();
                return data.display_name || 'Address not found.';
            } catch (error) { console.error('Error fetching address:', error); return 'Could not fetch address.'; }
        }
        
        function setLocationStatus(address, lat, lon, accuracy, isManual = false) {
            locationStatus.textContent = address || 'Address not found.';
            coordsDisplay.textContent = isManual ? 'Please enter address manually.' : (lat && lon && accuracy) ? `Lat: ${lat.toFixed(5)}, Lon: ${lon.toFixed(5)} (Accuracy: ${accuracy.toFixed(1)}m)` : '';
            locationIcon.classList.remove('animate-pulse');
            manualLocationBtn.classList.remove('hidden');
        }

        function showError(error) {
            let message = '';
            switch (error.code) {
                case error.PERMISSION_DENIED: message = "Location access denied."; break;
                case error.POSITION_UNAVAILABLE: message = "Location information is unavailable."; break;
                case error.TIMEOUT: message = "Location request timed out."; break;
                default: message = "An unknown error occurred."; break;
            }
            setLocationStatus(message, null, null, null, true);
        }

        function handleManualLocationToggle() { manualLocationForm.classList.toggle('hidden'); }

        function handleManualLocationSubmit() {
            const manualAddress = manualAddressInput.value.trim();
            if (manualAddress) {
                currentLocation = { address: manualAddress, latitude: null, longitude: null, accuracy: null };
                setLocationStatus(manualAddress, null, null, null, true);
                manualLocationForm.classList.add('hidden');
            }
        }
        
        function toBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result.split(',')[1]);
                reader.onerror = error => reject(error);
            });
        }

        async function handleImageSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            if (!currentLocation || (!currentLocation.address && !currentLocation.latitude)) {
                alert('Please determine your location before uploading an image.');
                return;
            }

            uploadedImageBase64 = await toBase64(file);
            mainCard.classList.add('hidden');
            confirmLocationCard.classList.remove('hidden');
            initializeConfirmationMap();
        }

        function initializeConfirmationMap() {
            if (!confirmationMap) {
                confirmationMap = L.map('confirm-map');
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(confirmationMap);
            }

            const center = [currentLocation.latitude || 26.9124, currentLocation.longitude || 75.7873];
            confirmationMap.setView(center, 17);
            
            const marker = L.marker(center, { draggable: true }).addTo(confirmationMap);
            confirmAddress.textContent = currentLocation.address || 'Drag pin to update address...';

            marker.on('dragend', async function(event) {
                const position = marker.getLatLng();
                const newAddress = await getAddressFromCoords(position.lat, position.lng);
                currentLocation = { ...currentLocation, latitude: position.lat, longitude: position.lng, address: newAddress };
                confirmAddress.textContent = newAddress;
            });

             // Invalidate map size to ensure it renders correctly after being un-hidden
            setTimeout(() => confirmationMap.invalidateSize(), 0);
        }

        async function submitFinalReport() {
            confirmLocationCard.classList.add('hidden');
            resultCard.classList.remove('hidden');
            loader.classList.remove('hidden');
            resultTitle.textContent = 'Analyzing Report...';
            resultMessage.textContent = 'Our AI is inspecting the image and preparing a detailed report.';
            resultImage.classList.add('hidden');
            assessmentDetails.classList.add('hidden');
            assessmentDetails.innerHTML = '';
            
            try {
                const response = await fetch('/api/submitReport', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image: uploadedImageBase64, location: currentLocation })
                });
                const result = await response.json();
                
                if (!response.ok) throw new Error(result.message || 'An unknown error occurred.');
                
                resultTitle.textContent = result.title;
                resultMessage.textContent = result.message;
                
                if (result.annotatedImage) {
                    resultImage.src = `data:image/jpeg;base64,${result.annotatedImage}`;
                    resultImage.classList.remove('hidden');
                }
                
                if(result.assessment && result.assessment.severity != null) {
                    assessmentDetails.innerHTML = `<h3 class="font-bold text-gray-200">AI Damage Assessment:</h3><p><span class="font-semibold text-gray-400">Severity:</span> ${result.assessment.severity}/10</p><p><span class="font-semibold text-gray-400">Type:</span> ${result.assessment.potholeType}</p><p><span class="font-semibold text-gray-400">Cost:</span> ${result.assessment.estimatedCost}</p>`;
                    assessmentDetails.classList.remove('hidden');
                }
            } catch (error) {
                resultTitle.textContent = 'Submission Failed';
                resultMessage.textContent = `An error occurred: ${error.message}`;
                console.error('Submission error:', error);
            } finally {
                loader.classList.add('hidden');
                imageUpload.value = '';
                uploadedImageBase64 = null;
            }
        }
        
        function cancelSubmission() {
            confirmLocationCard.classList.add('hidden');
            mainCard.classList.remove('hidden');
            imageUpload.value = '';
            uploadedImageBase64 = null;
        }

        function resetApp() {
            mainCard.classList.remove('hidden');
            resultCard.classList.add('hidden');
            mapCard.classList.add('hidden');
            confirmLocationCard.classList.add('hidden');
        }

        function showMapView() {
            mainCard.classList.add('hidden');
            resultCard.classList.add('hidden');
            mapCard.classList.remove('hidden');

            if (!publicMap) {
                publicMap = L.map('map').setView([26.9124, 75.7873], 13);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(publicMap);
                addLegend();
            }
            
            if (currentLocation && currentLocation.latitude) {
                publicMap.setView([currentLocation.latitude, currentLocation.longitude], 16);
            }
            
            loadMapMarkers();
             setTimeout(() => publicMap.invalidateSize(), 0);
        }
        
        async function loadMapMarkers() {
            try {
                const response = await fetch('/api/getReports');
                if (!response.ok) throw new Error('Failed to fetch reports');
                const reports = await response.json();
                
                publicMap.eachLayer(layer => { if (layer instanceof L.Marker) publicMap.removeLayer(layer); });

                reports.forEach(report => {
                    if (report.latitude && report.longitude) {
                        const markerIcon = icons[report.status] || defaultIcon;
                        const marker = L.marker([report.latitude, report.longitude], { icon: markerIcon }).addTo(publicMap);
                        const imgTag = report.imageUrl ? `<img src="${report.imageUrl}" class="leaflet-popup-image" alt="Pothole image">` : '';
                        marker.bindPopup(`
                            <div class="p-1">
                                <b class="text-sm font-semibold text-gray-100">${report.address || 'Reported Location'}</b>
                                <div class="mt-2 text-xs text-gray-300 leading-relaxed">
                                    Status: <span class="font-semibold text-cyan-400">${report.status}</span><br>
                                    Severity: <span class="font-semibold text-amber-400">${report.severity || 'N/A'}/10</span><br>
                                    Confirmations: <span class="font-semibold text-gray-400">${report.confirmations} reports</span>
                                </div>
                                ${imgTag}
                            </div>
                        `);
                    }
                });
            } catch (error) {
                console.error("Failed to load map markers:", error);
                alert("Could not load map data.");
            }
        }

        function addLegend() {
            const legend = L.control({position: 'bottomright'});
            legend.onAdd = function (map) {
                const div = L.DomUtil.create('div', 'info legend');
                const statuses = ['Submitted', 'In Review', 'Repaired'];
                const colors = ['#f85149', '#e3b341', '#2ea043'];
                div.innerHTML += '<h4>Status</h4>';
                for (let i = 0; i < statuses.length; i++) {
                    div.innerHTML += '<i style="background:' + colors[i] + '"></i> ' + statuses[i] + '<br>';
                }
                return div;
            };
            legend.addTo(publicMap);
        }
        
        function showReportView() {
            mainCard.classList.remove('hidden');
            mapCard.classList.add('hidden');
        }

        // --- EVENT LISTENERS ---
        document.addEventListener('DOMContentLoaded', getLocation);
        uploadButton.addEventListener('click', () => imageUpload.click());
        imageUpload.addEventListener('change', handleImageSelect);
        manualLocationBtn.addEventListener('click', handleManualLocationToggle);
        submitManualLocation.addEventListener('click', handleManualLocationSubmit);
        confirmSubmitBtn.addEventListener('click', submitFinalReport);
        cancelSubmitBtn.addEventListener('click', cancelSubmission);
        reportAnotherBtn.addEventListener('click', resetApp);
        mapViewBtn.addEventListener('click', showMapView);
        backToReportBtn.addEventListener('click', showReportView);

    </script>
</body>

</html>
