<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Pothole Reporter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
        }
        .card {
            background-color: #161b22;
            border: 1px solid #30363d;
        }
        .btn-primary {
            background-color: #238636;
            transition: background-color 0.2s;
        }
        .btn-primary:hover {
            background-color: #2ea043;
        }
        .btn-secondary {
            background-color: #21262d;
            border: 1px solid #30363d;
            transition: background-color 0.2s;
        }
        .btn-secondary:hover {
            background-color: #30363d;
        }
        .loader {
            border-top-color: #58a6ff;
        }
        #map, #confirm-map {
            height: 400px;
            border-radius: 0.5rem;
            border: 1px solid #30363d;
        }
        .leaflet-popup-content-wrapper, .leaflet-popup-tip {
            background: #161b22;
            color: #c9d1d9;
            border: 1px solid #30363d;
        }
        .legend {
            background: rgba(22, 27, 34, 0.8);
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #30363d;
            color: #c9d1d9;
            line-height: 1.5;
        }
        .legend i {
            width: 18px;
            height: 18px;
            float: left;
            margin-right: 8px;
            border-radius: 50%;
            border: 1px solid #c9d1d9;
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-lg mx-auto">
        <div id="main-card" class="card rounded-lg p-6 shadow-lg">
            <div class="text-center mb-6">
                <h1 class="text-2xl font-bold text-gray-100">Pothole Reporter</h1>
                <p class="text-gray-400 mt-2">Help improve our roads. Report a pothole with AI-powered analysis.</p>
            </div>

            <div id="location-section" class="mb-4">
                <div class="flex items-center justify-center space-x-2 text-gray-400">
                    <svg id="location-icon" class="w-5 h-5 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                    <span id="location-status" class="font-medium text-gray-300">Fetching location...</span>
                </div>
                <p id="coords-display" class="text-xs text-center text-gray-500 mt-1"></p>
                <div class="text-center mt-3">
                    <button id="manual-location-btn" class="text-sm text-cyan-400 hover:text-cyan-300 hidden">Enter Address Manually</button>
                </div>
                <div id="manual-location-form" class="hidden mt-4 space-y-3">
                    <input type="text" id="manual-address-input" class="w-full bg-gray-900 border border-gray-700 rounded-md px-3 py-2 text-white focus:outline-none focus:ring-2 focus:ring-cyan-500" placeholder="Enter street address">
                    <button id="submit-manual-location" class="w-full btn-secondary text-white font-semibold py-2 px-4 rounded-md">Use This Address</button>
                </div>
            </div>

            <div id="upload-section">
                <input type="file" id="image-upload" class="hidden" accept="image/jpeg, image/png">
                <button id="upload-button" class="w-full btn-primary text-white font-bold py-3 px-4 rounded-lg flex items-center justify-center space-x-2">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                    <span>Upload Pothole Image</span>
                </button>
            </div>
            
            <div class="text-center mt-4">
                <button id="map-view-btn" class="text-sm text-cyan-400 hover:text-cyan-300">View Pothole Map</button>
            </div>
        </div>

        <!-- NEW: Confirm Location Card -->
        <div id="confirm-location-card" class="card rounded-lg p-6 shadow-lg hidden mt-4">
            <div class="text-center">
                <h2 class="text-xl font-bold text-gray-100 mb-2">Confirm Pothole Location</h2>
                <p class="text-gray-400 text-sm mb-4">Drag the pin to the exact location of the pothole.</p>
                <div id="confirm-map"></div>
                <p id="confirm-address" class="text-sm text-gray-300 mt-4 font-medium"></p>
                <button id="confirm-submit-btn" class="w-full btn-primary text-white font-bold py-3 px-4 rounded-lg mt-4">Confirm Location & Submit</button>
                <button id="cancel-submit-btn" class="w-full btn-secondary text-white font-semibold py-2 px-4 rounded-md mt-2">Cancel</button>
            </div>
        </div>

        <div id="result-card" class="card rounded-lg p-6 shadow-lg hidden mt-4">
             <div class="text-center">
                <h2 id="result-title" class="text-xl font-bold text-gray-100"></h2>
                <div id="loader" class="hidden my-4 w-12 h-12 border-4 border-gray-600 rounded-full loader mx-auto animate-spin"></div>
                <p id="result-message" class="text-gray-400 mt-2"></p>
                <img id="result-image" class="mt-4 rounded-lg border border-gray-700 max-h-80 w-auto mx-auto" alt="Pothole detection result">
                <div id="assessment-details" class="hidden mt-4 text-left text-sm space-y-2"></div>
                <button id="report-another-btn" class="w-full btn-secondary text-white font-semibold py-2 px-4 rounded-md mt-6">Report Another Pothole</button>
            </div>
        </div>
        
        <div id="map-card" class="card rounded-lg p-6 shadow-lg hidden mt-4">
             <div class="text-center">
                <h2 class="text-xl font-bold text-gray-100 mb-4">Live Pothole Map</h2>
                <div id="map"></div>
                <button id="back-to-report-btn" class="w-full btn-secondary text-white font-semibold py-2 px-4 rounded-md mt-6">Back to Reporter</button>
            </div>
        </div>
    </div>

    <script>
        // --- DOM ELEMENTS ---
        const mainCard = document.getElementById('main-card');
        const confirmLocationCard = document.getElementById('confirm-location-card');
        const resultCard = document.getElementById('result-card');
        const mapCard = document.getElementById('map-card');
        const uploadButton = document.getElementById('upload-button');
        const imageUpload = document.getElementById('image-upload');
        const locationStatus = document.getElementById('location-status');
        const coordsDisplay = document.getElementById('coords-display');
        const locationIcon = document.getElementById('location-icon');
        const manualLocationBtn = document.getElementById('manual-location-btn');
        const manualLocationForm = document.getElementById('manual-location-form');
        const manualAddressInput = document.getElementById('manual-address-input');
        const submitManualLocation = document.getElementById('submit-manual-location');
        const confirmMapEl = document.getElementById('confirm-map');
        const confirmAddress = document.getElementById('confirm-address');
        const confirmSubmitBtn = document.getElementById('confirm-submit-btn');
        const cancelSubmitBtn = document.getElementById('cancel-submit-btn');
        const loader = document.getElementById('loader');
        const resultTitle = document.getElementById('result-title');
        const resultMessage = document.getElementById('result-message');
        const resultImage = document.getElementById('result-image');
        const assessmentDetails = document.getElementById('assessment-details');
        const reportAnotherBtn = document.getElementById('report-another-btn');
        const mapViewBtn = document.getElementById('map-view-btn');
        const backToReportBtn = document.getElementById('back-to-report-btn');

        // --- STATE ---
        let currentLocation = null;
        let publicMap = null;
        let confirmationMap = null;
        let uploadedImageBase64 = null;

        const createCircleMarker = (color) => L.divIcon({ className: 'custom-div-icon', html: `<div style="background-color:${color};width:20px;height:20px;border-radius:50%;border:2px solid white;"></div>`, iconSize: [24, 24], iconAnchor: [12, 12] });
        const icons = { 'Submitted': createCircleMarker('#f85149'), 'In Review': createCircleMarker('#e3b341'), 'Repaired': createCircleMarker('#2ea043') };
        const defaultIcon = createCircleMarker('#808080');

        // --- FUNCTIONS ---
        function getLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    async (position) => {
                        const { latitude, longitude, accuracy } = position.coords;
                        const address = await getAddressFromCoords(latitude, longitude);
                        currentLocation = { latitude, longitude, accuracy, address };
                        setLocationStatus(address, latitude, longitude, accuracy);
                    }, showError, { enableHighAccuracy: true }
                );
            } else {
                setLocationStatus("Geolocation is not supported.", null, null, null, true);
            }
        }

        async function getAddressFromCoords(lat, lon) {
            try {
                const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`);
                const data = await response.json();
                return data.display_name || 'Address not found.';
            } catch (error) { console.error('Error fetching address:', error); return 'Could not fetch address.'; }
        }
        
        function setLocationStatus(address, lat, lon, accuracy, isManual = false) {
            locationStatus.textContent = address || 'Address not found.';
            coordsDisplay.textContent = isManual ? 'Please enter address manually.' : (lat && lon && accuracy) ? `Lat: ${lat.toFixed(5)}, Lon: ${lon.toFixed(5)} (Accuracy: ${accuracy.toFixed(1)}m)` : '';
            locationIcon.classList.remove('animate-pulse');
            manualLocationBtn.classList.remove('hidden');
        }

        function showError(error) {
            let message = '';
            switch (error.code) {
                case error.PERMISSION_DENIED: message = "Location access denied."; break;
                case error.POSITION_UNAVAILABLE: message = "Location information is unavailable."; break;
                case error.TIMEOUT: message = "Location request timed out."; break;
                default: message = "An unknown error occurred."; break;
            }
            setLocationStatus(message, null, null, null, true);
        }

        function handleManualLocationToggle() { manualLocationForm.classList.toggle('hidden'); }

        function handleManualLocationSubmit() {
            const manualAddress = manualAddressInput.value.trim();
            if (manualAddress) {
                currentLocation = { address: manualAddress, latitude: null, longitude: null, accuracy: null };
                setLocationStatus(manualAddress, null, null, null, true);
                manualLocationForm.classList.add('hidden');
            }
        }
        
        function toBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result.split(',')[1]);
                reader.onerror = error => reject(error);
            });
        }

        async function handleImageSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            if (!currentLocation || (!currentLocation.address && !currentLocation.latitude)) {
                alert('Please determine your location before uploading an image.');
                return;
            }

            uploadedImageBase64 = await toBase64(file);
            mainCard.classList.add('hidden');
            confirmLocationCard.classList.remove('hidden');
            initializeConfirmationMap();
        }

        function initializeConfirmationMap() {
            if (!confirmationMap) {
                confirmationMap = L.map('confirm-map');
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(confirmationMap);
            }

            const center = [currentLocation.latitude || 26.9124, currentLocation.longitude || 75.7873];
            confirmationMap.setView(center, 17);
            
            const marker = L.marker(center, { draggable: true }).addTo(confirmationMap);
            confirmAddress.textContent = currentLocation.address || 'Drag pin to update address...';

            marker.on('dragend', async function(event) {
                const position = marker.getLatLng();
                const newAddress = await getAddressFromCoords(position.lat, position.lng);
                currentLocation = { ...currentLocation, latitude: position.lat, longitude: position.lng, address: newAddress };
                confirmAddress.textContent = newAddress;
            });

             // Invalidate map size to ensure it renders correctly after being un-hidden
            setTimeout(() => confirmationMap.invalidateSize(), 0);
        }

        async function submitFinalReport() {
            confirmLocationCard.classList.add('hidden');
            resultCard.classList.remove('hidden');
            loader.classList.remove('hidden');
            resultTitle.textContent = 'Analyzing Report...';
            resultMessage.textContent = 'Our AI is inspecting the image and preparing a detailed report.';
            resultImage.classList.add('hidden');
            assessmentDetails.classList.add('hidden');
            assessmentDetails.innerHTML = '';
            
            try {
                const response = await fetch('/api/submitReport', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image: uploadedImageBase64, location: currentLocation })
                });
                const result = await response.json();
                
                if (!response.ok) throw new Error(result.message || 'An unknown error occurred.');
                
                resultTitle.textContent = result.title;
                resultMessage.textContent = result.message;
                
                if (result.annotatedImage) {
                    resultImage.src = `data:image/jpeg;base64,${result.annotatedImage}`;
                    resultImage.classList.remove('hidden');
                }
                
                if(result.assessment && result.assessment.severity != null) {
                    assessmentDetails.innerHTML = `<h3 class="font-bold text-gray-200">AI Damage Assessment:</h3><p><span class="font-semibold text-gray-400">Severity:</span> ${result.assessment.severity}/10</p><p><span class="font-semibold text-gray-400">Type:</span> ${result.assessment.potholeType}</p><p><span class="font-semibold text-gray-400">Cost:</span> ${result.assessment.estimatedCost}</p>`;
                    assessmentDetails.classList.remove('hidden');
                }
            } catch (error) {
                resultTitle.textContent = 'Submission Failed';
                resultMessage.textContent = `An error occurred: ${error.message}`;
                console.error('Submission error:', error);
            } finally {
                loader.classList.add('hidden');
                imageUpload.value = '';
                uploadedImageBase64 = null;
            }
        }
        
        function cancelSubmission() {
            confirmLocationCard.classList.add('hidden');
            mainCard.classList.remove('hidden');
            imageUpload.value = '';
            uploadedImageBase64 = null;
        }

        function resetApp() {
            mainCard.classList.remove('hidden');
            resultCard.classList.add('hidden');
            mapCard.classList.add('hidden');
            confirmLocationCard.classList.add('hidden');
        }

        function showMapView() {
            mainCard.classList.add('hidden');
            resultCard.classList.add('hidden');
            mapCard.classList.remove('hidden');

            if (!publicMap) {
                publicMap = L.map('map').setView([26.9124, 75.7873], 13);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(publicMap);
                addLegend();
            }
            
            if (currentLocation && currentLocation.latitude) {
                publicMap.setView([currentLocation.latitude, currentLocation.longitude], 16);
            }
            
            loadMapMarkers();
             setTimeout(() => publicMap.invalidateSize(), 0);
        }
        
        async function loadMapMarkers() {
            try {
                const response = await fetch('/api/getReports');
                if (!response.ok) throw new Error('Failed to fetch reports');
                const reports = await response.json();
                
                publicMap.eachLayer(layer => { if (layer instanceof L.Marker) publicMap.removeLayer(layer); });

                reports.forEach(report => {
                    if (report.latitude && report.longitude) {
                        const markerIcon = icons[report.status] || defaultIcon;
                        const marker = L.marker([report.latitude, report.longitude], { icon: markerIcon }).addTo(publicMap);
                        marker.bindPopup(`<b>${report.address}</b><br>Status: <b>${report.status}</b><br>Severity: ${report.severity || 'N/A'}/10<br>Confirmations: ${report.confirmations}`);
                    }
                });
            } catch (error) {
                console.error("Failed to load map markers:", error);
                alert("Could not load map data.");
            }
        }

        function addLegend() {
            const legend = L.control({position: 'bottomright'});
            legend.onAdd = function (map) {
                const div = L.DomUtil.create('div', 'info legend');
                const statuses = ['Submitted', 'In Review', 'Repaired'];
                const colors = ['#f85149', '#e3b341', '#2ea043'];
                div.innerHTML += '<h4>Status</h4>';
                for (let i = 0; i < statuses.length; i++) {
                    div.innerHTML += '<i style="background:' + colors[i] + '"></i> ' + statuses[i] + '<br>';
                }
                return div;
            };
            legend.addTo(publicMap);
        }
        
        function showReportView() {
            mainCard.classList.remove('hidden');
            mapCard.classList.add('hidden');
        }

        // --- EVENT LISTENERS ---
        document.addEventListener('DOMContentLoaded', getLocation);
        uploadButton.addEventListener('click', () => imageUpload.click());
        imageUpload.addEventListener('change', handleImageSelect);
        manualLocationBtn.addEventListener('click', handleManualLocationToggle);
        submitManualLocation.addEventListener('click', handleManualLocationSubmit);
        confirmSubmitBtn.addEventListener('click', submitFinalReport);
        cancelSubmitBtn.addEventListener('click', cancelSubmission);
        reportAnotherBtn.addEventListener('click', resetApp);
        mapViewBtn.addEventListener('click', showMapView);
        backToReportBtn.addEventListener('click', showReportView);

    </script>
</body>

</html>
