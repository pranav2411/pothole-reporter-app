<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Pothole Reporter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .spinner { border-top-color: #3498db; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        #location-icon.loading { animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        #map { height: calc(100vh - 80px); }
        .leaflet-popup-content-wrapper { border-radius: 8px; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">

    <div id="app-container">
        <!-- Reporter View -->
        <div id="reporter-view" class="flex items-center justify-center min-h-screen p-4">
            <div class="w-full max-w-md bg-white rounded-xl shadow-lg p-6 md:p-8 space-y-6">
                
                <div class="text-center">
                    <div class="flex items-center justify-center mx-auto w-16 h-16 bg-red-100 rounded-full mb-4">
                         <svg class="w-8 h-8 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    </div>
                    <h1 class="text-2xl font-bold text-gray-900">Advanced Pothole Reporter</h1>
                    <p class="text-gray-500 mt-1">AI-powered road safety platform.</p>
                </div>

                <button id="view-map-btn" class="w-full px-4 py-2 bg-gray-800 text-white font-semibold rounded-lg shadow-md hover:bg-gray-900">View Live Pothole Map</button>

                <div class="bg-gray-50 p-4 rounded-lg">
                    <h2 class="font-semibold text-gray-700 mb-2 flex items-center">
                        <svg id="location-icon" class="w-5 h-5 mr-2 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                        Report Location
                    </h2>
                    <p id="location-status" class="text-sm text-gray-600">Fetching your location...</p>
                    <p id="accuracy-status" class="text-xs text-gray-500 mt-1"></p>
                    <div id="manual-location-section" class="hidden mt-2">
                         <button id="manual-location-btn" class="text-xs text-blue-600 hover:underline">Enter Address Manually</button>
                    </div>
                    <form id="location-form" class="hidden mt-3 space-y-2">
                        <input type="text" id="address-input" placeholder="Enter street address" class="w-full text-sm border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500">
                        <button type="submit" class="text-xs px-2 py-1 bg-blue-600 text-white rounded-md hover:bg-blue-700">Use this address</button>
                    </form>
                </div>

                <div id="upload-section">
                     <label for="file-upload" class="relative cursor-pointer w-full flex flex-col items-center justify-center h-48 bg-white border-2 border-dashed border-gray-300 rounded-lg hover:bg-gray-50 transition-colors">
                        <div class="text-center">
                            <svg class="mx-auto h-12 w-12 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                            <p class="mt-2 text-sm font-medium text-blue-600">Click to upload an image</p>
                            <p class="mt-1 text-xs text-gray-500">PNG, JPG, GIF</p>
                        </div>
                    </label>
                    <input id="file-upload" type="file" class="sr-only" accept="image/*">
                </div>

                <div id="result-section" class="hidden space-y-4">
                    <div class="text-center">
                        <h2 id="result-title" class="text-lg font-semibold text-gray-800"></h2>
                        <p id="result-message" class="text-sm text-gray-600"></p>
                    </div>
                    <img id="result-image" class="rounded-lg shadow-md max-w-full mx-auto" alt="Analysis result">
                    <!-- AI Assessment Results will be injected here -->
                    <div id="ai-assessment-results" class="hidden space-y-2 bg-gray-50 p-3 rounded-lg"></div>
                </div>

                <div id="status-section" class="hidden flex flex-col items-center justify-center text-center space-y-3">
                     <div class="spinner w-8 h-8 rounded-full border-4 border-gray-200"></div>
                     <p id="status-text" class="text-sm text-gray-600 font-medium"></p>
                </div>
            </div>
        </div>

        <!-- Map View -->
        <div id="map-view" class="hidden">
            <div class="bg-white shadow-md p-4 flex justify-between items-center">
                <h1 class="text-xl font-bold">Live Pothole Map</h1>
                <button id="view-reporter-btn" class="px-4 py-2 bg-blue-600 text-white font-semibold rounded-lg shadow-md hover:bg-blue-700">Report a New Pothole</button>
            </div>
            <div id="map"></div>
        </div>
    </div>

    <!-- Firebase SDK - This is a placeholder, you will get this from the setup guide -->
    <script type="module">
        const firebaseConfig = {
            apiKey: "AIzaSyA9M2GhHPTGSfiis4jaEECB-n98J_mE-jg",
            authDomain: "pothole-reporter-app-dadb4.firebaseapp.com",
            projectId: "pothole-reporter-app-dadb4",
            storageBucket: "pothole-reporter-app-dadb4.firebasestorage.app",
            messagingSenderId: "34414624141",
            appId: "1:34414624141:web:a001b8c1cf1cb2618a91c4",
            measurementId: "G-M9G049GPWT"
        };
        window.firebaseConfig = firebaseConfig;
    </script>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        window.initializeApp = initializeApp;
    </script>

    <script>
        // Main Application Logic
        document.addEventListener('DOMContentLoaded', () => {
            if (window.initializeApp) {
                const app = window.initializeApp(window.firebaseConfig);
            } else {
                console.error("Firebase App not initialized");
            }

            // DOM Elements
            const reporterView = document.getElementById('reporter-view');
            const mapView = document.getElementById('map-view');
            const viewMapBtn = document.getElementById('view-map-btn');
            const viewReporterBtn = document.getElementById('view-reporter-btn');
            const mapContainer = document.getElementById('map');
            const fileUpload = document.getElementById('file-upload');
            const uploadSection = document.getElementById('upload-section');
            const resultSection = document.getElementById('result-section');
            const statusSection = document.getElementById('status-section');
            const statusText = document.getElementById('status-text');
            const locationStatus = document.getElementById('location-status');
            const accuracyStatus = document.getElementById('accuracy-status');
            const locationIcon = document.getElementById('location-icon');
            const manualLocationSection = document.getElementById('manual-location-section');
            const manualLocationBtn = document.getElementById('manual-location-btn');
            const locationForm = document.getElementById('location-form');
            const addressInput = document.getElementById('address-input');
            const resultImage = document.getElementById('result-image');
            const resultTitle = document.getElementById('result-title');
            const resultMessage = document.getElementById('result-message');
            const aiAssessmentResults = document.getElementById('ai-assessment-results');

            // App State
            let currentLocation = { latitude: null, longitude: null, address: 'Not available', accuracy: null, isManual: false };
            let map = null;

            // --- View Management ---
            viewMapBtn.addEventListener('click', showMapView);
            viewReporterBtn.addEventListener('click', () => {
                mapView.classList.add('hidden');
                reporterView.classList.remove('hidden');
            });

            async function showMapView() {
                reporterView.classList.add('hidden');
                mapView.classList.remove('hidden');
                if (!map) initMap();
                await loadPotholesOnMap();
            }

            // --- Map Logic ---
            function initMap() {
                map = L.map(mapContainer).setView([26.9124, 75.7873], 13); // Default to Jaipur
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
                }).addTo(map);
            }

            async function loadPotholesOnMap() {
                if (map.potholesLayer) map.potholesLayer.clearLayers();
                else map.potholesLayer = L.layerGroup().addTo(map);

                showStatus('Loading live pothole data...');
                try {
                    const response = await fetch('/api/getReports');
                    const reports = await response.json();

                    if (!response.ok) throw new Error(reports.message);
                    
                    reports.forEach(report => {
                        const marker = L.marker([report.latitude, report.longitude]).addTo(map.potholesLayer);
                        let popupContent = `
                            <b>${report.address}</b><br>
                            <b>Status:</b> ${report.status}<br>
                            <b>Confirmations:</b> ${report.confirmations}<br>
                            <hr class="my-1">
                            <b>AI Severity:</b> ${report.severity || 'N/A'}/10<br>
                            <b>Est. Cost:</b> ${report.cost || 'N/A'}<br>
                            <b>Weather:</b> ${report.weather || 'N/A'}<br>
                            <img src="${report.imageUrl}" width="150" class="mt-2 rounded"/>
                        `;
                        marker.bindPopup(popupContent);
                    });
                } catch(error) {
                    console.error("Error loading potholes:", error);
                    alert("Could not load pothole data from the server.");
                } finally {
                    hideStatus();
                }
            }

            // --- Location Logic ---
            function getLocation() {
                locationIcon.classList.add('loading');
                navigator.geolocation.getCurrentPosition(
                    pos => showPosition(pos),
                    err => showError(err),
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            }

            async function showPosition(position) {
                currentLocation = {
                    latitude: position.coords.latitude,
                    longitude: position.coords.longitude,
                    accuracy: position.coords.accuracy,
                    isManual: false
                };
                accuracyStatus.textContent = `Accuracy: within ${currentLocation.accuracy.toFixed(0)} meters.`;

                try {
                    const response = await fetch(`https://api.opencagedata.com/geocode/v1/json?q=${currentLocation.latitude}+${currentLocation.longitude}&key='2e0018d31b4d415598d575ff48495d84'`);
                    const data = await response.json();
                    currentLocation.address = data.results[0].formatted;
                    setLocationStatus(currentLocation.address, 'success');
                } catch (error) {
                    currentLocation.address = `Lat: ${currentLocation.latitude.toFixed(4)}, Lon: ${currentLocation.longitude.toFixed(4)}`;
                    setLocationStatus(currentLocation.address, 'warning');
                }
            }

            function showError(error) {
                setLocationStatus("Could not get location. Please enter manually.", 'error');
                accuracyStatus.textContent = '';
            }
            
            function setLocationStatus(text, status) {
                 locationStatus.textContent = text;
                 locationIcon.classList.remove('loading', 'text-green-500', 'text-red-500', 'text-yellow-500');
                 const colorClass = { success: 'text-green-500', error: 'text-red-500', warning: 'text-yellow-500' }[status] || 'text-gray-400';
                 locationIcon.classList.add(colorClass);
                 manualLocationSection.classList.remove('hidden');
            }

            manualLocationBtn.addEventListener('click', () => {
                locationForm.classList.remove('hidden');
                manualLocationBtn.classList.add('hidden');
            });
            
            locationForm.addEventListener('submit', (e) => {
                e.preventDefault();
                currentLocation = { latitude: null, longitude: null, address: addressInput.value.trim(), accuracy: null, isManual: true };
                setLocationStatus(`${currentLocation.address} (Manual Entry)`, 'success');
                accuracyStatus.textContent = '';
                locationForm.classList.add('hidden');
            });

            // --- Main Reporting Logic ---
            fileUpload.addEventListener('change', async (event) => {
                const file = event.target.files[0];
                if (!file) return;

                uploadSection.classList.add('hidden');
                resultSection.classList.add('hidden');
                showStatus('Uploading image...');

                const reader = new FileReader();
                reader.onload = async (e) => {
                    const imageBase64 = e.target.result;
                    resultImage.src = imageBase64; // Show original image while processing

                    try {
                        showStatus('Submitting report for analysis...');
                        const response = await fetch('/api/submitReport', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                image: imageBase64.split(',')[1], // Send only base64 part
                                location: currentLocation
                            })
                        });

                        const result = await response.json();
                        if (!response.ok) throw new Error(result.message);

                        displayFinalResult(result);

                    } catch (error) {
                        console.error("Submission failed:", error);
                        displayFinalResult({
                            status: 'error',
                            message: `Submission failed: ${error.message}`
                        });
                    }
                };
                reader.readAsDataURL(file);
            });

            function displayFinalResult(result) {
                hideStatus();
                resultSection.classList.remove('hidden');
                resultTitle.textContent = result.title || "Report Processed";
                resultMessage.textContent = result.message || "An unknown error occurred.";

                if (result.annotatedImage) {
                    resultImage.src = `data:image/jpeg;base64,${result.annotatedImage}`;
                }

                if (result.assessment) {
                    aiAssessmentResults.innerHTML = `
                        <p class="font-semibold text-center">AI Damage Assessment</p>
                        <div class="text-sm grid grid-cols-2 gap-2 text-center">
                            <div class="bg-white p-2 rounded-md shadow-sm">
                                <p class="text-xs text-gray-500">Severity Score</p>
                                <p class="font-bold text-lg text-red-600">${result.assessment.severity}/10</p>
                            </div>
                            <div class="bg-white p-2 rounded-md shadow-sm">
                                <p class="text-xs text-gray-500">Est. Repair Cost</p>
                                <p class="font-bold text-lg text-green-600">${result.assessment.estimatedCost}</p>
                            </div>
                        </div>
                    `;
                    aiAssessmentResults.classList.remove('hidden');
                }
            }

            function showStatus(text) {
                statusText.textContent = text;
                statusSection.classList.remove('hidden');
            }
            function hideStatus() {
                statusSection.classList.add('hidden');
            }
            
            // Init
            getLocation();
        });
    </script>
</body>
</html>
